    answer: "You can track your order using the tracking link in your shipping confirmation email, or log in to your account on our website."
  - question: "What payment methods do you accept?"
    answer: "We accept Visa, Mastercard, American Express, PayPal, and Apple Pay."
  - question: "Do you ship internationally?"
    answer: "Yes, we ship to most countries. International shipping rates and delivery times vary by destination."
  - question: "How do I contact a human agent?"
    answer: "Ask to speak with a human agent and I will create a support ticket for our team to follow up with you."

agent:
  greeting: "Hi! I'm the customer service assistant for {business_name}. How can I help you today?"
  escalation_message: "I've created a support ticket for you. A team member will reach out within 24 hours."
  tone: "friendly, professional, and helpful"
